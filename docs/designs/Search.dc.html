<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Visual search</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.g-btn{display:flex;flex-direction:row;align-items:center;gap:7px;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:#E8E8EE;font:500 13px/1 Geist,sans-serif;cursor:pointer}
.g-btn:hover{background:rgba(255,255,255,.09)}
.g-key{font:500 10px/1 'Geist Mono',monospace;color:#9A9AA8}
.g-card{display:flex;flex-direction:column;gap:8px;padding:0;border:0;background:transparent;text-align:left;cursor:pointer;color:#E8E8EE;font-family:Geist,sans-serif}
.g-card:hover .g-tile{outline:2px solid rgba(255,255,255,.35)}
.g-tile{height:116px;border-radius:12px}
</style>
</helmet>
<div style="position:relative;width:1280px;height:800px;overflow:hidden;font-family:Geist,system-ui,sans-serif;background:linear-gradient(135deg,#2B3A55 0%,#4B3F72 55%,#7A4E6D 100%)">

<div style="position:absolute;left:0;top:0;right:0;height:34px;background:rgba(10,10,16,.55);display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#E8E8EE;font-size:13px;font-weight:500">
<span>Activities</span><span>Tue 13 Oct  10:42</span><span style="color:#B8B8C6">EN · 82%</span>
</div>

<div style="position:absolute;left:120px;top:80px;width:1040px;height:660px;border-radius:14px;background:#F6F4EF;box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden">
<div style="height:44px;background:#E9E6DE;display:flex;align-items:center;gap:8px;padding:0 16px">
<span style="width:12px;height:12px;border-radius:6px;background:#C9C5BA"></span><span style="width:12px;height:12px;border-radius:6px;background:#C9C5BA"></span><span style="width:12px;height:12px;border-radius:6px;background:#C9C5BA"></span>
<span style="margin-left:24px;font-size:13px;color:#6B685F">Carnets de la baie</span>
</div>
<div style="position:absolute;left:48px;top:70px;width:560px">
<h1 style="margin:0 0 14px;font-size:32px;line-height:1.15;font-weight:600;color:#1E1D1A">Les marées de la baie</h1>
<p style="margin:0;font-size:16px;line-height:1.6;color:#3A3832">À marée basse, la baie s'étend sur plus de vingt kilomètres.</p>
</div>
</div>

<!-- selection around the photo -->
<div style="position:absolute;left:812px;top:150px;width:300px;height:380px;box-sizing:border-box;border:1.5px solid {{accent}};border-radius:12px;box-shadow:0 0 0 2000px rgba(8,8,14,.58);background:linear-gradient(160deg,#9DB7B0,#5F7F86)">
<div style="position:absolute;left:-1.5px;top:-34px;display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:8px;background:{{accent}};color:#12121A;font:600 12px/1 Geist,sans-serif"><span style="width:7px;height:7px;border-radius:4px;background:#12121A"></span>Searching this region</div>
<div style="position:absolute;left:0;right:0;top:46%;height:2px;background:{{accent}};box-shadow:0 0 18px 4px {{accent}}"></div>
</div>

<!-- bar under the selection -->
<div style="position:absolute;left:812px;top:552px;display:flex;align-items:center;gap:2px;padding:6px;border-radius:18px;background:rgba(24,24,32,.78);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 50px rgba(0,0,0,.5)">
<button class="g-btn">Refine region</button>
<button class="g-btn">Search text instead <span class="g-key">T</span></button>
</div>

<!-- results sheet -->
<aside style="position:absolute;left:24px;top:50px;width:420px;height:726px;box-sizing:border-box;border-radius:22px;background:rgba(22,22,30,.86);backdrop-filter:blur(26px);border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 80px rgba(0,0,0,.55);color:#E8E8EE;display:flex;flex-direction:column">
<div style="display:flex;align-items:center;gap:14px;padding:18px 20px 14px">
<div style="width:56px;height:70px;border-radius:10px;flex:none;background:linear-gradient(160deg,#9DB7B0,#5F7F86);outline:2px solid {{accent}}"></div>
<div style="flex:1;min-width:0">
<div style="font:600 16px Geist,sans-serif">Visual search</div>
<div style="font-size:12px;color:#9A9AA8;margin-top:4px">300 × 380 · 24 matches</div>
</div>
<button aria-label="Close" style="width:44px;height:44px;border:0;border-radius:12px;background:rgba(255,255,255,.07);color:#E8E8EE;cursor:pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
<div style="display:flex;gap:6px;padding:0 20px 14px">
<button class="g-btn" style="min-height:36px;border-radius:999px;background:{{accent}};color:#12121A;font-weight:600">All</button>
<button class="g-btn" style="min-height:36px;border-radius:999px;background:rgba(255,255,255,.07)">Similar images</button>
<button class="g-btn" style="min-height:36px;border-radius:999px;background:rgba(255,255,255,.07)">Pages</button>
</div>
<div style="flex:1;overflow:hidden;padding:0 20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 14px;align-content:start">
<button class="g-card"><div class="g-tile" style="background:linear-gradient(140deg,#7C9C95,#3F5C66)"></div><div style="font:500 13px/1.3 Geist,sans-serif">[Result title]</div><div style="font-size:11px;color:#9A9AA8;margin-top:-4px">source-one.example</div></button>
<button class="g-card"><div class="g-tile" style="background:linear-gradient(140deg,#A5B8C9,#586C86)"></div><div style="font:500 13px/1.3 Geist,sans-serif">[Result title]</div><div style="font-size:11px;color:#9A9AA8;margin-top:-4px">source-two.example</div></button>
<button class="g-card"><div class="g-tile" style="background:linear-gradient(140deg,#B9A58A,#6E5A47)"></div><div style="font:500 13px/1.3 Geist,sans-serif">[Result title]</div><div style="font-size:11px;color:#9A9AA8;margin-top:-4px">source-three.example</div></button>
<button class="g-card"><div class="g-tile" style="background:linear-gradient(140deg,#8FA7A0,#4D6B6B)"></div><div style="font:500 13px/1.3 Geist,sans-serif">[Result title]</div><div style="font-size:11px;color:#9A9AA8;margin-top:-4px">source-four.example</div></button>
<button class="g-card"><div class="g-tile" style="background:linear-gradient(140deg,#98A8D0,#4B4F82)"></div><div style="font:500 13px/1.3 Geist,sans-serif">[Result title]</div><div style="font-size:11px;color:#9A9AA8;margin-top:-4px">source-five.example</div></button>
<button class="g-card"><div class="g-tile" style="background:linear-gradient(140deg,#C8B7A0,#7B6A58)"></div><div style="font:500 13px/1.3 Geist,sans-serif">[Result title]</div><div style="font-size:11px;color:#9A9AA8;margin-top:-4px">source-six.example</div></button>
</div>
<div style="display:flex;gap:8px;padding:14px 20px 20px">
<button style="flex:1;min-height:44px;border:0;border-radius:12px;background:{{accent}};color:#12121A;font:600 13px Geist,sans-serif;cursor:pointer">Open all in browser</button>
<button aria-label="Copy link" style="width:44px;min-height:44px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:transparent;color:#E8E8EE;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg></button>
</div>
</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8B7CFF","options":["#8B7CFF","#3DD6B5","#FF9F5A","#5AA9FF"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#8B7CFF' };
}
}
</script>
</body>
</html>
