<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Translate in place</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.g-btn{display:flex;flex-direction:row;align-items:center;gap:7px;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:#E8E8EE;font:500 13px/1 Geist,sans-serif;cursor:pointer}
.g-btn:hover{background:rgba(255,255,255,.09)}
.g-btn svg{width:18px;height:18px}
.g-key{font:500 10px/1 'Geist Mono',monospace;color:#9A9AA8}
.g-div{width:1px;height:28px;background:rgba(255,255,255,.12);margin:0 4px}
</style>
</helmet>
<div style="position:relative;width:1280px;height:800px;overflow:hidden;font-family:Geist,system-ui,sans-serif;background:linear-gradient(135deg,#2B3A55 0%,#4B3F72 55%,#7A4E6D 100%)">

<div style="position:absolute;left:0;top:0;right:0;height:34px;background:rgba(10,10,16,.55);display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#E8E8EE;font-size:13px;font-weight:500">
<span>Activities</span><span>Tue 13 Oct  10:42</span><span style="color:#B8B8C6">EN · 82%</span>
</div>

<div style="position:absolute;left:120px;top:80px;width:1040px;height:660px;border-radius:14px;background:#F6F4EF;box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden">
<div style="height:44px;background:#E9E6DE;display:flex;align-items:center;gap:8px;padding:0 16px">
<span style="width:12px;height:12px;border-radius:6px;background:#C9C5BA"></span><span style="width:12px;height:12px;border-radius:6px;background:#C9C5BA"></span><span style="width:12px;height:12px;border-radius:6px;background:#C9C5BA"></span>
<span style="margin-left:24px;font-size:13px;color:#6B685F">Carnets de la baie</span>
</div>
<div style="position:absolute;right:48px;top:70px;width:300px;height:380px;border-radius:12px;background:linear-gradient(160deg,#9DB7B0,#5F7F86)"></div>
</div>

<!-- selection, text replaced by the translation, same position and rhythm -->
<div style="position:absolute;left:156px;top:138px;width:584px;height:196px;box-sizing:border-box;border:1.5px solid {{accent}};box-shadow:0 0 0 2000px rgba(8,8,14,.58);background:#F6F4EF;padding:10px">
<div style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#9A6B3F;margin-bottom:10px">Report</div>
<h1 style="margin:0 0 14px;font-size:32px;line-height:1.15;font-weight:600;color:#1E1D1A">The tides of the bay</h1>
<p style="margin:0;font-size:16px;line-height:1.6;color:#3A3832">At low tide, the bay stretches over twenty kilometres. The fishers set out before dawn, following the channels the sea carved during the night.</p>
<div style="position:absolute;right:10px;top:-13px;display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:{{accent}};color:#12121A;font:600 11px/1 Geist,sans-serif">FR <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg> EN</div>
</div>

<!-- bar below the selection -->
<div style="position:absolute;left:156px;top:356px;display:flex;align-items:center;gap:2px;padding:6px;border-radius:18px;background:rgba(24,24,32,.78);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 50px rgba(0,0,0,.5)">
<button class="g-btn" style="gap:9px;padding:0 12px 0 14px">Français <svg viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 8h13M16 4l4 4-4 4M17 16H4M8 12l-4 4 4 4"/></svg> English</button>
<span class="g-div"></span>
<div style="display:flex;padding:3px;border-radius:12px;background:rgba(255,255,255,.07);gap:2px">
<button class="g-btn" style="min-height:36px;background:rgba(255,255,255,.14)">Replace in image</button>
<button class="g-btn" style="min-height:36px">Side by side</button>
</div>
<span class="g-div"></span>
<button class="g-btn" aria-label="Copy translation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg>Copy</button>
<button class="g-btn" aria-label="Save image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>Save</button>
</div>

<div style="position:absolute;left:156px;top:424px;display:flex;align-items:center;gap:8px;color:#C9C9D6;font-size:12px">
<span style="width:8px;height:8px;border-radius:4px;background:#3DD6B5"></span>Translated on this device · hold <span class="g-key">Alt</span> to peek at the original
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8B7CFF","options":["#8B7CFF","#3DD6B5","#FF9F5A","#5AA9FF"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#8B7CFF' };
}
}
</script>
</body>
</html>
